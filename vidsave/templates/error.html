<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vidsave — failed</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f4; --fg: #16161a; --muted: #6a6a72;
    --bad-bg: #fdeceb; --bad-fg: #8c1d18; --bad-line: #f3c4c0; --accent: #1f6feb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14141a; --fg: #ececf0; --muted: #9a9aa4;
      --bad-bg: #3a1c1a; --bad-fg: #ffb4ad; --bad-line: #5e2a26; --accent: #5b9dff;
    }
  }
  body {
    margin: 0; padding: 40px 16px;
    background: var(--bg); color: var(--fg);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; }
  .box {
    background: var(--bad-bg); border: 1px solid var(--bad-line);
    color: var(--bad-fg); border-radius: 12px; padding: 18px 20px;
  }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { margin: 0; }
  a { display: inline-block; margin-top: 20px; color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="box">
    <h1>{{ message }}</h1>
    {% if hint %}<p>{{ hint }}</p>{% endif %}
  </div>
  <p><a href="/">← Back</a></p>
</main>
</body>
</html>
